  html, body { margin: 0; padding: 0; }
  body { font-family: var(--font-sans); color: var(--text-body); background: var(--surface-page); }
  *, *::before, *::after { box-sizing: border-box; }
  [data-site-scroll]::-webkit-scrollbar { width: 10px; }
  [data-site-scroll]::-webkit-scrollbar-thumb { background: var(--steel-300); border-radius: 999px; }
  a { color: inherit; }
  ::selection { background: var(--brand); color: #fff; }

  /* ============================================================
     Navias — responsive layout (desktop / laptop / tablet / phone)
     Grid definitions live here as classes so they can collapse at
     breakpoints (inline styles can't hold media queries).
     ============================================================ */
  .site-header  { padding: 0 var(--space-7); }
  .site-hero-grid { display:grid; grid-template-columns: 1.05fr 0.95fr; gap: var(--space-9); align-items:center; }
  .site-metrics   { display:grid; grid-template-columns: repeat(2,1fr); gap: var(--space-7); justify-content:center; justify-items:center; text-align:center; max-width: 480px; margin: 0 auto; }
  .site-approach  { display:grid; grid-template-columns: repeat(3,1fr); gap: var(--space-6); }
  .site-exp-tabs [role="tab"] { font-size: var(--text-md) !important; font-weight: 600 !important; padding: 12px 18px !important; border-radius: var(--radius-sm) var(--radius-sm) 0 0; }
  .site-exp-tabs [role="tab"][aria-selected="false"] { color: var(--text-body) !important; }
  .site-exp-tabs [role="tab"]:hover { background: var(--surface-hover); color: var(--text-strong) !important; }
  .site-exp-tabs [role="tab"][aria-selected="true"] { font-weight: 700 !important; }
  .site-exp-tabs [role="tab"][aria-selected="true"] > span { height: 3px !important; }
  .site-exp-head { display:flex; flex-wrap:wrap; justify-content:center; align-items:baseline; gap: var(--space-2) var(--space-4); }
  .site-exp-list { display:flex; flex-wrap:wrap; justify-content:center; gap: var(--space-6) var(--space-7); max-width: 1000px; margin-inline:auto; }
  .site-exp-item { flex: 0 1 280px; min-width:0; display:flex; flex-direction:column; align-items:center; text-align:center; gap: var(--space-2); padding-top: var(--space-5); border-top:2px solid var(--brand); }
  .site-exp-gallery { display:grid; grid-template-columns: repeat(3,1fr); gap: var(--space-5); }
  .site-caps      { display:grid; grid-template-columns: repeat(3,1fr); gap: var(--space-5); }
  .site-company   { display:grid; grid-template-columns: 0.85fr 1.15fr; gap: var(--space-9); align-items:start; }
  .site-contact   { display:grid; grid-template-columns: 1fr 1fr; gap: var(--space-9); align-items:center; }
  .site-lead      { display:grid; grid-template-columns: 1fr 280px; gap: var(--space-9); align-items:start; }
  .site-form      { display:grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }

  /* Laptop / small-desktop & tablet-landscape */
  @media (max-width: 1024px) {
    .site-hero-grid { grid-template-columns: 1fr; gap: var(--space-8); }
    .site-exp-list { max-width: 520px; }
    .site-exp-item { flex-basis: 100%; }
    .site-company   { grid-template-columns: 1fr; gap: var(--space-7); }
    .site-contact   { grid-template-columns: 1fr; gap: var(--space-7); }
    .site-lead      { grid-template-columns: 1fr; gap: var(--space-6); }
    .site-caps      { grid-template-columns: 1fr; }
  }
  /* Tablet portrait */
  @media (max-width: 820px) {
    .site-approach  { grid-template-columns: 1fr; }
    .site-exp-gallery { grid-template-columns: 1fr; }
  }
  /* Phone */
  @media (max-width: 640px) {
    .site-navlinks { display: none; }
    .site-header   { padding: 0 var(--space-4); }
    .site-form     { grid-template-columns: 1fr; }
    .site-metrics  { grid-template-columns: 1fr; }
    .site-section-pad { padding-left: var(--space-4) !important; padding-right: var(--space-4) !important; }
  }
</style>

// Navia marketing site — video that loads via Blob URL (the serving env
// doesn't support HTTP range requests, which <video src> streaming needs).
// Falls back to a poster image / subtle panel if the fetch fails.
function BlobVideo({ src, poster, style = {}, height = 320, fit = 'cover' }) {
  const { t } = useLang();
  const [url, setUrl] = React.useState(null);
  const [failed, setFailed] = React.useState(false);
  const [broken, setBroken] = React.useState(false);
  const vref = React.useRef(null);

  React.useEffect(() => {
    let objUrl = null, alive = true;
    fetch(window.assetUrl ? window.assetUrl(src) : src)
      .then((r) => { if (!r.ok) throw new Error('http ' + r.status); return r.blob(); })
      .then((blob) => {
        if (!alive) return;
        objUrl = URL.createObjectURL(blob);
        setUrl(objUrl);
      })
      .catch(() => alive && setFailed(true));
    return () => { alive = false; if (objUrl) URL.revokeObjectURL(objUrl); };
  }, [src]);

  React.useEffect(() => {
    if (url && vref.current) { vref.current.play().catch(() => {}); }
  }, [url]);

  const base = { display: 'block', width: '100%', height, objectFit: fit, background: fit === 'contain' ? '#CFD6E4' : '#0d121a', ...style };

  // If fetch-to-blob is unavailable (e.g. opened directly from disk via file://),
  // fall back to letting the <video> element load the file itself.
  if (failed && !broken) {
    return (
      <video ref={vref} src={window.assetUrl ? window.assetUrl(src) : src} poster={poster} autoPlay loop muted playsInline preload="auto"
        onError={() => setBroken(true)} style={base} />
    );
  }
  if (broken) {
    return poster
      ? <img src={poster} alt="" style={{ ...base, background: '#cfd6e4' }} />
      : <div style={{ ...base, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <span style={{ fontFamily: 'var(--font-mono)', fontSize: 'var(--text-2xs)', letterSpacing: '0.1em', textTransform: 'uppercase', color: 'rgba(226,232,245,0.5)' }}>{t('simPanel.preview')}</span>
        </div>;
  }
  return (
    <video ref={vref} src={url || undefined} poster={poster} autoPlay loop muted playsInline preload="auto" style={base} />
  );
}

window.BlobVideo = BlobVideo;

function ServiceMedia({ media, cap, selKey, onSelect, height = 210 }) {
  if (media.type === 'toggle') {
    const opt = media.options.find((x) => x.key === selKey) || media.options[0];
    const control = (
      <div style={{ display: 'inline-flex', gap: 3, padding: 3, background: 'rgba(13,18,26,0.72)', backdropFilter: 'blur(6px)', borderRadius: 'var(--radius-md)', border: '1px solid rgba(255,255,255,0.16)', boxShadow: '0 4px 12px rgba(0,0,0,0.3)' }}>
        {media.options.map((x) => {
          const on = x.key === opt.key;
          return (
            <button key={x.key} onClick={() => onSelect(x.key)} style={{
              appearance: 'none', border: 'none', cursor: 'pointer',
              padding: '4px 10px', borderRadius: 'var(--radius-sm)',
              fontFamily: 'var(--font-mono)', fontSize: 'var(--text-2xs)', letterSpacing: '0.06em', textTransform: 'uppercase', fontWeight: 600,
              background: on ? 'var(--brand)' : 'transparent', color: on ? '#fff' : 'rgba(226,232,245,0.7)',
              transition: 'background var(--dur-fast), color var(--dur-fast)',
            }}>{cap.toggleTabs[x.key]}</button>
          );
        })}
      </div>
    );
    return <SimPanel video={opt.type === 'video'} src={opt.src} solver={cap.solver} title={cap.titles[opt.key]} live height={height} fit={opt.fit || 'cover'} overlayControl={control} />;
  }
  return <SimPanel video={media.type === 'video'} src={media.src} solver={cap.solver} title={cap.title} live height={height} fit={media.fit || 'cover'} />;
}

<script type="text/babel" data-presets="react">
function App() {
  const [active, setActive] = React.useState('top');
  const [lang, setLang] = React.useState(() => localStorage.getItem('naviasLang') || 'en');
  React.useEffect(() => { localStorage.setItem('naviasLang', lang); document.documentElement.lang = lang; }, [lang]);
  const t = (path) => tr(lang, path);

  const onNav = (id) => {
    setActive(id);
    if (id === 'top') { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    const el = document.getElementById(id);
    if (!el) return;
    const top = el.getBoundingClientRect().top + window.scrollY - 56;
    window.scrollTo({ top, behavior: 'smooth' });
  };

  return (
    <LangContext.Provider value={{ lang, t, setLang }}>
      <Header onNav={onNav} active={active} />
      <main>
        <Hero onNav={onNav} />
        <Intro />
        <Approach />
        <Expertise />
        <Capabilities />
        <Company />
        <Footer />
      </main>
    </LangContext.Provider>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
